server.port=${SERVER_PORT:8087}
spring.application.name=notifications-service

# -------------------------------------------------------
# HashiCorp Vault: fetch secrets securely at startup
# -------------------------------------------------------
spring.config.import=optional:vault://
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=${VAULT_ADDR:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN:my-root-token}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=kv
spring.cloud.vault.kv.default-context=cs02-app
spring.cloud.vault.authentication=TOKEN

# MongoDB Configuration — URI resolved from Vault key: notifications_mongodb_uri
spring.data.mongodb.uri=${notifications_mongodb_uri:mongodb://localhost:27017/CSO2_notifications_service}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Mail Configuration — credentials resolved from Vault keys: mail_username, mail_password
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${mail_username:your-email@gmail.com}
spring.mail.password=${mail_password:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio Configuration — resolved from Vault keys: twilio_account_sid, twilio_auth_token, twilio_phone_number
twilio.account_sid=${twilio_account_sid:}
twilio.auth_token=${twilio_auth_token:}
twilio.phone_number=${twilio_phone_number:}

# Firebase Configuration
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}

# Admin Email
admin.email=${ADMIN_EMAIL:admin@cso2.com}
