server.port=${SERVER_PORT:8087}
spring.application.name=notifications-service

# MongoDB Configuration
# URI is injected at runtime from HashiCorp Vault (secret/cso2/services/notifications-service-mongo)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/CSO2_notifications_service}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio Configuration
twilio.account_sid=${TWILIO_ACCOUNT_SID:}
twilio.auth_token=${TWILIO_AUTH_TOKEN:}
twilio.phone_number=${TWILIO_PHONE_NUMBER:}

# Firebase Configuration
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}

# Admin Email
admin.email=${ADMIN_EMAIL:admin@cso2.com}
